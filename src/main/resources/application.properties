server.port=0
spring.application.name=resilient-idempotent-gateway

# 日志带 MDC traceId，保证入口/业务/下游可关联
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [traceId=%X{traceId:-}] %logger{36} - %msg%n

# ---- 幂等入口 ----
# 幂等记录存活时间（秒）：过期后同键重放返回 410 IDEMPOTENCY_EXPIRED
gateway.idempotency.ttl-seconds=300
# 并发提交时等待首个请求完成的最长时间（毫秒），超时返回 409 CONCURRENT_SUBMISSION
gateway.idempotency.acquire-wait-millis=200

# ---- 下游韧性（按依赖名配置，default 为兜底；四类策略相互独立）----
gateway.resilience.dependencies.default.call-timeout-millis=1000
gateway.resilience.dependencies.default.max-attempts=2
gateway.resilience.dependencies.default.backoff-millis=20
gateway.resilience.dependencies.default.failure-threshold=5
gateway.resilience.dependencies.default.open-millis=2000
gateway.resilience.dependencies.default.bulkhead-max-concurrent=10

# payment 依赖（本地模拟；生产可替换为真实客户端）
gateway.resilience.dependencies.payment.call-timeout-millis=1000
gateway.resilience.dependencies.payment.max-attempts=2
gateway.resilience.dependencies.payment.backoff-millis=20
gateway.resilience.dependencies.payment.failure-threshold=5
gateway.resilience.dependencies.payment.open-millis=2000
gateway.resilience.dependencies.payment.bulkhead-max-concurrent=10
